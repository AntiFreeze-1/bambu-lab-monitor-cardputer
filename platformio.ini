[env:m5stack-cardputer]
platform  = espressif32
board     = m5stack-cardputer
framework = arduino

lib_deps =
    m5stack/M5Cardputer @ ^1.0.0
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed  = 921600
